name: Deploy Backend (AWS SAM)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy AWS SAM
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build Java Package with Maven
        run: mvn clean package -DskipTests

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: SAM Build
        run: sam build
        env:
          MAVEN_OPTS: "-DskipTests"
          JWT_SECRET: "secreto_dev_fallback"

      - name: SAM Deploy
        run: sam deploy --parameter-overrides Stage=prod --no-confirm-changeset --no-fail-on-empty-changeset
