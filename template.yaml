AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  LedgerOS - Your Financial Operational System

Globals:
  Function:
    Runtime: java21
    Timeout: 15
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        STAGE: !Ref Stage
        USERS_TABLE_NAME: !Ref UsersTable
        REFRESH_TOKENS_TABLE_NAME: !Ref RefreshTokensTable

Parameters:
  Stage:
    Type: String
    Default: dev

Resources:

  LedgerOsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: LedgerOS API
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'GET,POST,OPTIONS'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200
      Auth:
        Authorizers:
          CustomAuthorizer:
            FunctionArn: !GetAtt AuthorizationFunction.Arn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization

  # Authorization Lambda (Custom Authorizer)
  AuthorizationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-authorization
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.auth.AuthorizationLambda::handleRequest
      Environment:
        Variables:
          SECRET_NAME: ledgeros/dev/jwt-secret
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ledgeros/*"

  # Public Health Check
  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-health-check
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.health.HealthCheckLambda::handleRequest
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref LedgerOsApi
            Path: /healthcheck
            Method: GET

  # Protected Health Check (Secured by Custom Authorizer)
  ProtectedHealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-protected-health-check
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.health.ProtectedHealthCheckLambda::handleRequest
      Events:
        ProtectedHealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref LedgerOsApi
            Path: /healthcheck/protected
            Method: GET
            Auth:
              Authorizer: CustomAuthorizer

  # Register Lambda
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-register
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.auth.RegisterLambda::handleRequest
      Policies:
        - AmazonDynamoDBFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - "dynamodb:*"
              Resource: "*"
      Events:
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref LedgerOsApi
            Path: /auth/register
            Method: POST

  # Verify Email Lambda
  VerifyEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-verify-email
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.auth.VerifyEmailLambda::handleRequest
      Policies:
        - AmazonDynamoDBFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - "dynamodb:*"
              Resource: "*"
      Events:
        VerifyEmail:
          Type: Api
          Properties:
            RestApiId: !Ref LedgerOsApi
            Path: /auth/verify-email
            Method: POST

  # Login Lambda
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-login
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.auth.LoginLambda::handleRequest
      Environment:
        Variables:
          SECRET_NAME: ledgeros/dev/jwt-secret
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ledgeros/*"
        - AmazonDynamoDBFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - "dynamodb:*"
              Resource: "*"
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref LedgerOsApi
            Path: /auth/login
            Method: POST

  # Logout Lambda
  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-logout
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.auth.LogoutLambda::handleRequest
      Policies:
        - AmazonDynamoDBFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - "dynamodb:*"
              Resource: "*"
      Events:
        Logout:
          Type: Api
          Properties:
            RestApiId: !Ref LedgerOsApi
            Path: /auth/logout
            Method: POST

  # Forgot Password Lambda
  ForgotPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-forgot-password
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.auth.ForgotPasswordLambda::handleRequest
      Policies:
        - AmazonDynamoDBFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - "dynamodb:*"
              Resource: "*"
      Events:
        ForgotPassword:
          Type: Api
          Properties:
            RestApiId: !Ref LedgerOsApi
            Path: /auth/forgot-password
            Method: POST

  # Reset Password Lambda
  ResetPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-reset-password
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.auth.ResetPasswordLambda::handleRequest
      Policies:
        - AmazonDynamoDBFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - "dynamodb:*"
              Resource: "*"
      Events:
        ResetPassword:
          Type: Api
          Properties:
            RestApiId: !Ref LedgerOsApi
            Path: /auth/reset-password
            Method: POST

  # Refresh Token Lambda
  RefreshTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ledgeros-refresh-token
      CodeUri: .
      Handler: com.ledgeros.presentation.lambda.auth.RefreshTokenLambda::handleRequest
      Environment:
        Variables:
          SECRET_NAME: ledgeros/dev/jwt-secret
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ledgeros/*"
        - AmazonDynamoDBFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - "dynamodb:*"
              Resource: "*"
      Events:
        RefreshToken:
          Type: Api
          Properties:
            RestApiId: !Ref LedgerOsApi
            Path: /auth/refresh
            Method: POST

  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ledgeros-${Stage}-users"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ledgeros-${Stage}-refresh-tokens"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:

  ApiUrl:
    Description: LedgerOS API URL
    Value: !Sub "https://${LedgerOsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  LoginUrl:
    Description: Login Endpoint
    Value: !Sub "https://${LedgerOsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/login"

  RegisterUrl:
    Description: Register Endpoint
    Value: !Sub "https://${LedgerOsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/register"

  VerifyEmailUrl:
    Description: Verify Email Endpoint
    Value: !Sub "https://${LedgerOsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/verify-email"

  LogoutUrl:
    Description: Logout Endpoint
    Value: !Sub "https://${LedgerOsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/logout"

  ForgotPasswordUrl:
    Description: Forgot Password Endpoint
    Value: !Sub "https://${LedgerOsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/forgot-password"

  ResetPasswordUrl:
    Description: Reset Password Endpoint
    Value: !Sub "https://${LedgerOsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/reset-password"
